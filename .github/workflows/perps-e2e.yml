name: Perps E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perps:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:typecheck
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: perps-e2e-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
