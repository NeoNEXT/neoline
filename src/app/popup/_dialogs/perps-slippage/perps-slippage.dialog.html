<div class="pop-ups-title">
  {{ "perpsEditSlippage" | translate | async }}
  <img
    class="close"
    [mat-dialog-close]="false"
    theme
    src="assets/images/common/close.svg"
    alt=""
  />
</div>

<div class="content">
  <p class="note">
    {{ "perpsSlippageNote" | translate | async }}
  </p>
  <div class="input-box">
    <input
      id="perps-slippage-input"
      type="number"
      inputmode="decimal"
      [min]="data.min"
      [max]="data.max"
      step="0.01"
      [(ngModel)]="value"
      (keydown.enter)="confirm()"
      autofocus
    />
    <span>%</span>
  </div>
  <p class="range-tip" *ngIf="!valid">
    {{
      "perpsSlippageRange"
        | translate : { min: data.min, max: data.max }
        | async
    }}
  </p>

  <div class="choose-group">
    <button
      class="confirm pop-ups"
      [class.disabled]="!valid"
      [disabled]="!valid"
      (click)="confirm()"
    >
      {{ "confirm" | translate | async }}
    </button>
  </div>
</div>
